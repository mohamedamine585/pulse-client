
<div class="main-layout">
  <div class="toolbar" [class.expanded]="isMenuOpen">
    <div class="tool-section">


      <div class="auto-save-container">
        <span class="auto-save-label">Auto Save</span>
        <div class="toggle-container">
          <label class="toggle-switch">
            <input type="checkbox"
                   [(ngModel)]="autoSaveEnabled"
                   (change)="toggleAutoSave()">
            <span class="toggle-slider"></span>
          </label>
          <span class="toggle-state">{{ autoSaveEnabled ? 'ON' : 'OFF' }}</span>
        </div>
      </div>
    </div>

    <div class="tool-section">
      <h3>Colors</h3>
      <div class="color-grid">
        <button
          *ngFor="let colorHex of colors"
          class="color-button"
          [class.active]="activeColor === colorHex"
          (click)="changeColor(colorHex)"
          [style.background-color]="colorHex"
          type="button">  <!-- Add type="button" to prevent default form submission -->
        </button>
      </div>
    </div>

    <div class="tool-section">
      <h3>Actions</h3>
      <button class="action-button" (click)="clearCanvas()">Clear</button>
      <button class="action-button" (click)="saveCanvas()">Save</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas #canvas></canvas>
  </div>

  <div class="right-space">
    <div class="users-events-panel">

      <!-- Connected Users -->
      <div class="panel-section">
        <h3>Connected Users ({{ connectedUsers.length }})</h3>
        <ul class="user-grid">
          <li *ngFor="let user of connectedUsers | slice:0:20" class="user-item">
          <span class="user-avatar" [style.background-color]="user.color">
            {{ user.initials }}
            <span
              class="status-dot"
              [ngClass]="{
                'drawing': user.status === 'drawing',
                'idle': user.status === 'idle',
                'active': user.status === 'active'
              }"></span>
          </span>
          </li>
        </ul>
      </div>

      <!-- Activity Feed -->
      <div class="panel-section">
        <h3>Activity Feed</h3>
        <ul class="event-list">
          <li *ngFor="let event of recentEvents"
              class="event-card"
              [ngClass]="{ 'fade': event.fading }">
          <span class="event-badge" [ngClass]="event.userEventType.toLowerCase()">
            <i *ngIf="event.userEventType==='USER_JOINED'" class="fas fa-sign-in-alt"></i>
            <i *ngIf="event.userEventType==='USER_LEFT'" class="fas fa-sign-out-alt"></i>
          </span>
            <div class="event-content">
              <p class="event-desc">{{ event.description }}</p>
              <span class="event-time">{{ event.timestamp | date:'shortTime' }}</span>
            </div>
          </li>
        </ul>
      </div>

    </div>
  </div>




</div>
