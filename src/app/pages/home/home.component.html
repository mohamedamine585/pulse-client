<div class="home-container">

  <!-- Enhanced Header -->
  <header class="app-header">
    <div class="header-content">

      <!-- Enhanced Logo -->
      <div class="brand">
        <div class="logo">
          <div class="logo-icon">
            <i class="fas fa-palette"></i>
          </div>
          <div class="logo-text">
            <span class="logo-primary">Pulse</span>
            <span class="logo-subtitle">Collaborate & Create</span>
          </div>
        </div>
      </div>

      <!-- User Section with Separate Dropdown Box -->
      <div class="user-section">
        <!-- User Info Display (always visible in nav) -->
        <div class="user-display" (click)="toggleDropdown($event)">
          <div class="user-avatar">
            <i class="fas fa-user-circle user-icon"></i>
          </div>
          <div class="user-info">
            <span class="username">username</span>
            <span class="user-status">Online</span>
          </div>
          <i class="fas fa-chevron-down dropdown-arrow" [class.rotated]="dropdownOpen"></i>
        </div>

        <!-- Separate Dropdown Box (appears below when opened) -->
        <div class="dropdown-box" *ngIf="dropdownOpen" (click)="$event.stopPropagation()">
          <div class="dropdown-option" (click)="openProfile()">
            <i class="fas fa-user"></i>
            <span>Profile</span>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-option logout" (click)="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </div>
        </div>
      </div>

    </div>
  </header>

  <!-- Enhanced Search Section -->
  <section class="search-section">
    <div class="search-container">
      <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input
          type="text"
          placeholder="Search Canvas Name, Tags, or Creator..."
          class="search-input"
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
        />
        <button class="search-btn" (click)="onSearch()">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>
  </section>

  <!-- Enhanced Canvas Collection -->
  <main class="main-content">

    <!-- Enhanced Create Button -->
    <div class="create-section">
      <button class="create-canvas-btn" (click)="createCanvas()">
        <div class="create-btn-content">
          <div class="create-icon">
            <i class="fas fa-plus"></i>
          </div>
          <div class="create-text">
            <span class="create-title">Create New Canvas</span>
            <span class="create-subtitle">Start a new collaborative project</span>
          </div>
        </div>
      </button>
    </div>

    <!-- Enhanced Canvas Grid -->
    <div class="canvas-grid">

      <!-- Canvas Cards -->
      <div class="canvas-card" *ngFor="let canvas of canvases">

        <!-- Card Header with Image -->
        <div class="card-header">
          <div class="card-image-container">
            <img class="card-image" [src]="canvas.image" [alt]="canvas.name" loading="lazy" />

            <!-- Enhanced Live Indicator -->
            <div *ngIf="canvas.participants && canvas.participants > 0" class="live-indicator">
              <span class="live-dot"></span>
              <span class="live-text">{{ canvas.participants }} live</span>
            </div>

            <!-- Card Overlay on Hover -->
            <div class="card-overlay">
              <button class="overlay-btn" (click)="openCanvas(canvas)">
                <i class="fas fa-play"></i>
                Open Canvas
              </button>
            </div>
          </div>
        </div>

        <!-- Card Content -->
        <div class="card-content">
          <h3 class="canvas-title">{{ canvas.name }}</h3>

          <div class="canvas-meta">
            <span class="meta-text">{{ canvas.meta }}</span>
            <div class="participants-count">
              <i class="fas fa-users"></i>
              <span>{{ canvas.participants || 0 }}</span>
            </div>
          </div>

          <div class="card-actions">
            <button class="primary-action" (click)="openCanvas(canvas)">
              {{ canvas.actionText }}
            </button>
            <div class="secondary-actions">
              <button class="icon-btn" title="Share">
                <i class="fas fa-share-alt"></i>
              </button>
              <button class="icon-btn" title="More options">
                <i class="fas fa-ellipsis-h"></i>
              </button>
            </div>
          </div>
        </div>

      </div>

    </div>

  </main>

</div>
