<div class="home-container">
  <!-- Header -->
  <!-- Header -->
  <div class="header">
    <div class="logo-row">
      <div class="logo">
        <i class="fas fa-palette"></i>
        <span>CanvasFlow</span>
      </div>

      <!-- User Icon & Dropdown -->
      <div class="user-dropdown" (click)="toggleDropdown()">
        <i class="fas fa-user-circle user-icon"></i>
        <span>username</span>
        <i class="fas fa-caret-down"></i>

        <div class="dropdown-menu" *ngIf="dropdownOpen">
          <button class="dropdown-item">My Profile</button>
          <button class="dropdown-item" (click)="goToSettings()">Settings</button>
          <button class="dropdown-item" (click)="logout()">Logout</button>
        </div>
      </div>
    </div>
  </div>


  <!-- Search & Add -->
  <div class="search-create-container">
    <div class="search-box">
      <input
        type="text"
        placeholder="Search Canvas Name, Tags, or Creator..."
        class="search-input"
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
      />
      <button class="search-btn" (click)="onSearch()">
        <i class="fas fa-search"></i>
      </button>
    </div>

  </div>

  <!-- Trending Canvases -->
  <h2 class="section-title"><i class="fas fa-fire"></i> Trending Canvases</h2>
  <div class="cards-container trending-canvases">
    <div class="card" *ngFor="let canvas of trendingCanvases">
      <div class="card-img-container">
        <img class="card-img" [src]="canvas.image" [alt]="canvas.title" />
        <div class="card-badge" [ngClass]="canvas.status.toLowerCase()">
          {{ canvas.status }}
        </div>
        <span *ngIf="canvas.live" class="live-dot"></span>
      </div>
      <div class="card-body">
        <h3 class="card-title">{{ canvas.title }}</h3>
        <div class="card-meta">
          <span>By: {{ canvas.creator }}</span>
          <span class="participants">
            <i class="fas fa-users"></i> {{ canvas.participants }}
          </span>
        </div>
        <p class="card-description">{{ canvas.description }}</p>
        <div class="card-actions">
          <button class="btn-primary" (click)="joinCanvas(canvas)">
            Join Canvas
          </button>
          <button class="btn-secondary"><i class="far fa-bookmark"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- My Collection -->
  <h2 class="section-title"><i class="fas fa-folder-open"></i> My Collection</h2>
  <div class="cards-container my-collection">
    <button class="fab-inline" (click)="createCanvas()">
      <i class="fas fa-plus"></i>
      <span>Create New Canvas</span>
    </button>

    <div class="card" *ngFor="let canvas of myCollection">
      <div class="card-img-container">
        <img class="card-img" [src]="canvas.image" [alt]="canvas.title" />
        <div class="card-badge" [ngClass]="canvas.status.toLowerCase()">
          {{ canvas.status }}
        </div>
        <span *ngIf="canvas.live" class="live-dot"></span>
      </div>
      <div class="card-body">
        <h3 class="card-title">{{ canvas.title }}</h3>
        <div class="card-meta">
          <span>{{ canvas.meta }}</span>
          <span class="participants">
            <i class="fas fa-users"></i> {{ canvas.participants }}
          </span>
        </div>
        <p class="card-description">{{ canvas.description }}</p>
        <div class="card-actions">
          <button class="btn-primary" (click)="openCanvas(canvas)">
            {{ canvas.actionText }}
          </button>
          <button class="btn-secondary">
            <i class="fas fa-ellipsis-h"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
