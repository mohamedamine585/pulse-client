<div class="home-container">

  <!-- Header -->
  <div class="header">
    <div class="logo-row">

      <!-- Logo -->
      <div class="logo">
        <i class="fas fa-palette"></i>
        <span>CanvasFlow</span>
      </div>

      <!-- User Icon & Dropdown -->
      <div class="user-dropdown" (click)="toggleDropdown()">
        <i class="fas fa-user-circle user-icon"></i>
        <span>username</span>
        <i class="fas fa-caret-down"></i>

        <div class="dropdown-menu" *ngIf="dropdownOpen">
          <button class="dropdown-item">My Profile</button>
          <button class="dropdown-item" (click)="logout()">Logout</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Search & Add Canvas -->
  <div class="search-create-container">
    <div class="search-box">
      <input
        type="text"
        placeholder="Search Canvas Name, Tags, or Creator..."
        class="search-input"
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
      />
      <button class="search-btn" (click)="onSearch()">
        <i class="fas fa-search"></i>
      </button>
    </div>
  </div>

  <!-- Canvas Collection -->
  <div class="cards-container">

    <!-- Create Canvas Button -->
    <button class="fab-inline" (click)="createCanvas()">
      <i class="fas fa-plus"></i>
      <span>Create New Canvas</span>
    </button>

    <!-- Canvas Cards -->
    <div class="card" *ngFor="let canvas of canvases">
      <div class="card-img-container">
        <img class="card-img" [src]="canvas.image" [alt]="canvas.name" loading="lazy" />

        <!-- Status Badge -->
        <div class="card-badge" [ngClass]="canvas.status">
          {{ canvas.status }}
        </div>

        <!-- Red glowing dot for active participants -->
        <span *ngIf="canvas.participants && canvas.participants > 0" class="live-dot"></span>
      </div>

      <div class="card-body">
        <h3 class="card-title">{{ canvas.name }}</h3>
        <div class="card-meta">
          <span>{{ canvas.meta }}</span>
          <span class="participants">
            <i class="fas fa-users"></i> {{ canvas.participants || 0 }}
          </span>
        </div>
        <div class="card-actions">
          <button class="btn-primary" (click)="openCanvas(canvas)">
            {{ canvas.actionText }}
          </button>
          <button class="btn-secondary">
            <i class="fas fa-ellipsis-h"></i>
          </button>
        </div>
      </div>
    </div>

  </div>

</div>
