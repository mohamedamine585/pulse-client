<div class="dialog-container">
  <!-- Header -->
  <div class="dialog-header">
    <div class="logo">
      <div class="logo-icon">
        <i class="fas fa-palette"></i>
      </div>
      <div class="logo-text">
        <h2>Create Canvas</h2>
        <p>Start a new collaborative project</p>
      </div>
    </div>
  </div>

  <!-- Form -->
  <form (ngSubmit)="startDrawing()" class="dialog-form">
    <!-- Canvas Name -->
    <div class="form-group">
      <label for="canvasName">Canvas Name</label>
      <input
        id="canvasName"
        type="text"
        [(ngModel)]="canvas.name"
        name="canvasName"
        required
        placeholder="Enter canvas name"
        class="form-input"
        (input)="clearError()"
      />
    </div>

    <!-- Privacy Toggle -->
    <div class="form-group privacy-toggle">
      <div class="toggle-label">
        <label for="isPublic">Public Canvas</label>
        <span class="hint">Anyone with the link can view and edit</span>
      </div>
      <mat-slide-toggle
        id="isPublic"
        [(ngModel)]="canvas.isPublic"
        name="isPublic"
        color="primary">
      </mat-slide-toggle>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
      <i class="fas fa-exclamation-circle"></i>
      {{ errorMessage }}
    </div>

    <!-- ACTIONS SECTION - FORCE VISIBLE -->
    <div class="dialog-actions" style="display: flex !important; visibility: visible !important; opacity: 1 !important;">
      <button type="button" class="btn-secondary"
              style="display: block !important; visibility: visible !important;">
        Cancel
      </button>
      <button type="submit" class="btn-primary"
              [disabled]="!canvas.name?.trim()"
              style="display: block !important; visibility: visible !important;">
        Create Canvas
      </button>
    </div>
  </form>
</div>
