name: Build & Push Angular Docker Image

on:
  push:
    branches:
      - main
      - release/*

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Node.js for Angular
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4️⃣ Build Angular app
      - name: Build Angular
        run: npm run build --prod --legacy-peer-deps

      # 5️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 6️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t mohamedaminelili02/pulse-web-client:latest .

      # 7️⃣ Push Docker image
      - name: Push Docker image
        run: |
          docker push mohamedaminelili02/pulse-web-client:latest
